<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reedah Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1>Reedah Settings</h1>
        <p>Configure ElevenLabs for cloud narration. Keys are stored locally in this browser.</p>
      </header>

      <section class="field">
        <label for="api-key">ElevenLabs API key</label>
        <input
          id="api-key"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="Paste your API key"
        />
        <p class="hint">Stored in Chrome local storage. Not synced.</p>
      </section>

      <section class="field">
        <label for="model-id">Model ID (optional)</label>
        <input
          id="model-id"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="eleven_multilingual_v2"
        />
        <p class="hint">Default voice ID: CwhRBWXzGAHq8TQ4Fs17.</p>
      </section>

      <div class="actions">
        <button id="save" class="primary" type="button">Save</button>
        <button id="clear" type="button">Clear</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
