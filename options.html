<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reedah Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1>Reedah Settings</h1>
        <p>Configure macOS narration settings for the native host.</p>
      </header>

      <section class="field">
        <label for="voice">Voice (optional)</label>
        <input
          id="voice"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="e.g., Samantha or com.apple.speech.synthesis.voice.Alex"
        />
        <p class="hint">Leave blank to use the system default voice.</p>
      </section>

      <section class="field">
        <label for="rate">Speech rate (optional)</label>
        <input
          id="rate"
          type="number"
          min="0"
          max="1"
          step="0.05"
          autocomplete="off"
          spellcheck="false"
          placeholder="0.5"
        />
        <p class="hint">Value between 0.0 and 1.0 mapped to speech rate. Leave blank for default.</p>
      </section>

      <div class="actions">
        <button id="save" class="primary" type="button">Save</button>
        <button id="clear" type="button">Clear</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
