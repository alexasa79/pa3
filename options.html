<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reedah Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1>Reedah Settings</h1>
        <p>Configure Kokoro settings for the Python native host.</p>
      </header>

      <section class="field">
        <label for="voice">Voice</label>
        <select id="voice"></select>
        <p class="hint">Default voice is <code>am_adam</code>.</p>
      </section>

      <section class="field">
        <label for="rate">Speech speed (optional)</label>
        <input
          id="rate"
          type="number"
          min="0.5"
          max="2"
          step="0.05"
          autocomplete="off"
          spellcheck="false"
          placeholder="1.0"
        />
        <p class="hint">Kokoro speed multiplier. Leave blank to use 1.0.</p>
      </section>

      <div class="actions">
        <button id="save" class="primary" type="button">Save</button>
        <button id="clear" type="button">Clear</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
